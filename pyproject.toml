[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-playtime"
dynamic = ["version"]
description = "Chart your Steam play time per game over time, from Steam's own session logs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["steam", "playtime", "games", "statistics", "chart"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/SergaFTW/Playtime-Evolution-Chart-for-Steam"
Issues = "https://github.com/SergaFTW/Playtime-Evolution-Chart-for-Steam/issues"

[project.scripts]
steam-playtime = "steam_playtime.cli:main"

[tool.setuptools]
packages = ["steam_playtime"]

[tool.setuptools.package-data]
steam_playtime = ["template.html"]

[tool.setuptools.dynamic]
version = { attr = "steam_playtime.__version__" }
