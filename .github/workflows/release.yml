name: release

# Push a tag like v0.1.0 to build the Windows .exe and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
        env:
          PYTHONIOENCODING: utf-8
      - run: pip install pyinstaller
      - run: python build_exe.py
      - name: Smoke test
        shell: bash
        run: ./dist/SteamPlaytime.exe --version
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/SteamPlaytime.exe
          generate_release_notes: true
